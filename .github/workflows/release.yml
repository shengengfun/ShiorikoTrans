name: Release

on:
    workflow_dispatch:
        inputs:
            sign-windows:
                description: 'Sign the Windows installer with SignPath Foundation'
                type: boolean
                default: false
            sign-macos:
                description: 'Sign and notarize macOS binaries with Apple Developer ID'
                type: boolean
                default: false

jobs:
    publish-tauri:
        timeout-minutes: 120
        permissions:
            contents: write
            actions: read
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: "macos-latest"
                      args: "--target aarch64-apple-darwin"
                      target_triple: "aarch64-apple-darwin"
                    - platform: "macos-latest"
                      args: "--target x86_64-apple-darwin"
                      target_triple: "x86_64-apple-darwin"
                    - platform: "ubuntu-22.04"
                      args: "--target x86_64-unknown-linux-gnu"
                      target_triple: "x86_64-unknown-linux-gnu"
                    - platform: "ubuntu-22.04-arm"
                      args: "--target aarch64-unknown-linux-gnu"
                      target_triple: "aarch64-unknown-linux-gnu"
        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/checkout@v4

            - name: setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  package_json_file: desktop/package.json

            - name: setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: desktop/pnpm-lock.yaml

            - name: setup uv
              uses: astral-sh/setup-uv@v5

            - name: Rust cache
              uses: swatinem/rust-cache@v2

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
                  targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

            - name: Install frontend dependencies
              run: pnpm install
              working-directory: ./desktop

            - name: Run pre_build.py on ${{ matrix.platform }}
              run: uv run scripts/pre_build.py --target ${{ matrix.target_triple }}

            - name: Generate release notes
              id: notes
              shell: bash
              run: |
                  ver=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' desktop/src-tauri/tauri.conf.json | head -1)
                  f="release-notes/v${ver}.md"
                  if [ -f "$f" ]; then cat "$f"; else echo "> 本版说明待补充，请在此 Release 页编辑。"; fi > body.md
                  {
                    echo 'body<<EOF'
                    cat body.md
                    echo 'EOF'
                  } >> "$GITHUB_OUTPUT"

            - name: Setup macOS signing env
              if: matrix.platform == 'macos-latest' && inputs.sign-macos
              run: |
                  echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}" >> "$GITHUB_ENV"
                  echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" >> "$GITHUB_ENV"
                  echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}" >> "$GITHUB_ENV"
                  echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> "$GITHUB_ENV"
                  echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}" >> "$GITHUB_ENV"
                  echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> "$GITHUB_ENV"

            - name: Build
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  # Tauri Updater
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
                  # Analytics (Aptabase)
                  APTABASE_APP_KEY: ${{ secrets.APTABASE_APP_KEY }}
                  APTABASE_BASE_URL: ${{ secrets.APTABASE_BASE_URL }}
              with:
                  tagName: v__VERSION__ # the action automatically replaces __VERSION__ with the app version.
                  releaseName: "v__VERSION__"
                  # 正文来自 release-notes/<tag>.md（模板见 release-notes/TEMPLATE.md）
                  releaseBody: ${{ steps.notes.outputs.body }}
                  # 只有带 "-" 的 tag（如 v1.1.0-beta.1）才算预发布，否则 /releases/latest 会跳过它
                  prerelease: ${{ contains(github.ref_name, '-') }}
                  args: ${{ matrix.args }}
                  projectPath: "./desktop"
                  tauriScript: pnpm exec tauri

    publish-windows:
        needs: publish-tauri
        runs-on: windows-latest
        timeout-minutes: 120
        permissions:
            actions: read
            contents: write
        steps:
            - uses: actions/checkout@v4

            - name: setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  package_json_file: desktop/package.json

            - name: setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: desktop/pnpm-lock.yaml

            - name: setup uv
              uses: astral-sh/setup-uv@v5

            - name: Rust cache
              uses: swatinem/rust-cache@v2

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable

            - name: Install frontend dependencies
              run: pnpm install
              working-directory: ./desktop

            - name: Run pre_build.py
              run: uv run scripts/pre_build.py --target x86_64-pc-windows-msvc

            # Do not give tauri-action a tag here: the cross-platform job has
            # already created the release, and Windows must be signed first.
            - name: Build unsigned Windows installer
              uses: tauri-apps/tauri-action@v0
              env:
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
                  APTABASE_APP_KEY: ${{ secrets.APTABASE_APP_KEY }}
                  APTABASE_BASE_URL: ${{ secrets.APTABASE_BASE_URL }}
              with:
                  args: --target x86_64-pc-windows-msvc --bundles nsis
                  projectPath: "./desktop"
                  tauriScript: pnpm exec tauri

            - name: Locate installer
              id: installer
              shell: pwsh
              run: |
                  $path = Get-ChildItem "target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1 -ExpandProperty FullName
                  if (-not $path) { throw "NSIS installer was not produced" }
                  "path=$path" >> $env:GITHUB_OUTPUT
                  "name=$(Split-Path $path -Leaf)" >> $env:GITHUB_OUTPUT

            # SignPath verifies this GitHub-hosted build through the artifact ID.
            # The SignPath artifact configuration must be a ZIP containing the
            # NSIS PE file; see docs/code-signing/signpath.md.
            - name: Upload unsigned installer for SignPath
              if: inputs.sign-windows
              id: upload-unsigned
              uses: actions/upload-artifact@v4
              with:
                  name: shiorikotrans-windows-unsigned
                  path: ${{ steps.installer.outputs.path }}
                  if-no-files-found: error
                  retention-days: 3

            - name: Submit SignPath signing request
              if: inputs.sign-windows
              uses: signpath/github-action-submit-signing-request@v2
              with:
                  api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
                  organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
                  project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
                  signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
                  artifact-configuration-slug: ${{ secrets.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
                  github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
                  wait-for-completion: true
                  output-artifact-directory: signed-windows

            - name: Select release installer
              id: release-installer
              shell: pwsh
              env:
                  SIGN_WINDOWS: ${{ inputs.sign-windows }}
                  UNSIGNED_PATH: ${{ steps.installer.outputs.path }}
                  INSTALLER_NAME: ${{ steps.installer.outputs.name }}
              run: |
                  if ($env:SIGN_WINDOWS -eq "true") {
                    $path = Get-ChildItem "signed-windows" -Filter $env:INSTALLER_NAME -Recurse | Select-Object -First 1 -ExpandProperty FullName
                    if (-not $path) { throw "SignPath did not return the signed installer" }
                  } else {
                    $path = $env:UNSIGNED_PATH
                  }
                  "path=$path" >> $env:GITHUB_OUTPUT

            - name: Verify Authenticode signature
              if: inputs.sign-windows
              shell: pwsh
              run: |
                  $signature = Get-AuthenticodeSignature "${{ steps.release-installer.outputs.path }}"
                  $signature | Format-List Status, StatusMessage, SignerCertificate
                  if ($signature.Status -ne "Valid") { throw "Invalid Authenticode signature: $($signature.Status)" }

            - name: Upload Windows installer to release
              shell: pwsh
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  $version = (Get-Content "desktop/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
                  gh release upload "v$version" "${{ steps.release-installer.outputs.path }}" --clobber

            # The slim flavour leaves out ffmpeg (~83 MB uncompressed, the single
            # biggest file in the package) and downloads it on demand instead.
            # Built last so it cannot clobber the full installer that was located,
            # signed and uploaded above.
            - name: Build slim Windows installer
              if: ${{ !inputs.sign-windows }}
              run: pnpm exec tauri build --bundles nsis --config src-tauri/tauri.slim.conf.json
              working-directory: ./desktop
              env:
                  APTABASE_APP_KEY: ${{ secrets.APTABASE_APP_KEY }}
                  APTABASE_BASE_URL: ${{ secrets.APTABASE_BASE_URL }}

            - name: Upload slim Windows installer to release
              if: ${{ !inputs.sign-windows }}
              shell: pwsh
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  $path = Get-ChildItem "target/release/bundle/nsis/ShiorikoTrans_*_x64-setup.exe" | Select-Object -First 1 -ExpandProperty FullName
                  if (-not $path) { throw "slim NSIS installer was not produced" }
                  $slim = $path -replace "-setup\.exe$", "-setup-slim.exe"
                  Move-Item $path $slim
                  $version = (Get-Content "desktop/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
                  gh release upload "v$version" $slim --clobber
