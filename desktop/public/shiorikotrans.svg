<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.2"/>
  <circle cx="50" cy="50" r="35" fill="none" stroke="url(#grad)" stroke-width="1" opacity="0.1"/>
  <g filter="url(#glow)">
    <path d="M20 50 Q30 30, 40 50 Q50 70, 60 50 Q70 30, 80 50" fill="none" stroke="url(#grad)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="8" fill="url(#grad)"/>
    <circle cx="50" cy="50" r="3" fill="white"/>
  </g>
</svg>